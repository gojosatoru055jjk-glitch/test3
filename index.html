<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

.container {
    position: fixed;
    top: 0;
    left: 0;

    width: 100vh;
    height: 100vw;

    transform: rotate(90deg) translateY(-100%);
    transform-origin: top left;

}

.container img,
.img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
</style>
<body>
    <div class="container">
        <img class="img" src="./image-01.png" alt="">
    </div>
    
</body>
</html>
